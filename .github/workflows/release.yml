name: Agent Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign and Release Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: go.sum

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
              VERSION="${GITHUB_REF#refs/tags/}"
            fi
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building agent version: ${VERSION}"

      - name: Run Test Suite with Race Detector
        run: go test -v -race ./...

      - name: Compile and Sign Binaries
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
          RELEASE: "1"
          ENV: "production"
          AGENT_PUBLIC_KEY: ${{ secrets.AGENT_PUBLIC_KEY }}
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          OUTPUT_DIR: "./dist"
        run: |
          mkdir -p ./dist
          chmod +x ./build-all.sh
          ./build-all.sh

      - name: Generate Checksum Digest
        run: |
          cd ./dist
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "RasnuOS Agent v${{ steps.vars.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/rasnuos-agent-*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
